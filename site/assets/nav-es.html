<script>
// Spam-proof email: the address is stored reversed in data attributes and
// only assembled in the visitor's browser (see privacy.qmd).
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll(".eml").forEach(function (el) {
    var r = function (s) { return s.split("").reverse().join(""); };
    var addr = r(el.dataset.a) + "@" + r(el.dataset.b);
    var a = document.createElement("a");
    a.href = "mailto:" + addr;
    a.textContent = addr;
    el.replaceWith(a);
  });
});

// Quarto has one navbar for the whole site. On Spanish pages (es/), translate
// its labels, point its links at the Spanish pages, and turn the language
// switch into "English".
// Quarto rewrites menu links to full URLs at load time, so links are matched
// by their resolved path (works for "../about.html" and "https://…/about").
var toSpanish = function (a) {
  var u = new URL(a.href, location.href);
  if (u.origin !== location.origin || u.hash === "#" || u.pathname.indexOf("/es/") === 0) return;
  a.setAttribute("href", "/es" + u.pathname);   // /about.html -> /es/about.html, / -> /es/
};
var fixSpanishNav = function () {
  if (document.documentElement.lang !== "es") return;
  var labels = {
    "Data": "Datos", "Search data": "Buscar datos", "All data (table)": "Todos los datos (tabla)",
    "Map": "Mapa", "Publications": "Publicaciones", "Search papers": "Buscar publicaciones",
    "All papers (table)": "Todas las publicaciones (tabla)", "Contribute": "Contribuir",
    "About": "Acerca de", "FAQ": "Preguntas", "Findings": "Hallazgos", "Privacy": "Privacidad"
  };
  document.querySelectorAll(".navbar a").forEach(function (el) {
    var text = el.querySelector(".menu-text") || el;
    var t = text.textContent.trim();
    if (labels[t]) text.textContent = labels[t];
    if (t === "Español" || t === "English") {      // language switch -> same page in English
      el.setAttribute("href", location.pathname.replace(/^\/es\//, "/"));
      text.textContent = "English";
    } else if (el.getAttribute("href") && el.getAttribute("href") !== "#" &&
               !el.hasAttribute("data-bs-toggle")) {   // leave dropdown headings alone
      toSpanish(el);
    }
  });
  var foot = document.querySelector(".nav-footer-center");
  if (!foot || foot.dataset.es) return;
  foot.dataset.es = "1";
  foot.querySelectorAll("a").forEach(function (a) {
    if (/privacy(\.html)?$/.test(new URL(a.href, location.href).pathname)) {
      toSpanish(a);
      a.textContent = "Privacidad y condiciones";
    }
  });
  foot.innerHTML = foot.innerHTML
    .replace("Metadata CC0", "Metadatos CC0")
    .replace("Each dataset and paper keeps its own license and citation", "Cada conjunto de datos y publicación conserva su licencia y cita")
    .replace("Paper metadata from OpenAlex (CC0) and Crossref", "Metadatos de publicaciones de OpenAlex (CC0) y Crossref")
    .replace("Boundary", "Límite");
};
// Run once the page is parsed and again after Quarto's own link rewriting.
document.addEventListener("DOMContentLoaded", fixSpanishNav);
window.addEventListener("load", fixSpanishNav);
</script>
