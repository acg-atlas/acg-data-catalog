project:
  type: website
  output-dir: _site
  post-render: _seo.R
  resources:
    - data/*.json
    - data/*.geojson

website:
  title: "ACG Atlas"
  site-url: https://acg-atlas.pages.dev   # change to the final domain
  description: "Research data and publications from Área de Conservación Guanacaste, Costa Rica."
  open-graph: true
  twitter-card: true
  navbar:
    left:
      - text: Data
        menu:
          - href: explore.qmd
            text: Search data
          - href: browse.qmd
            text: All data (table)
          - href: map.qmd
            text: Map
      - text: Publications
        menu:
          - href: papers.qmd
            text: Search papers
          - href: papers-table.qmd
            text: All papers (table)
      - href: contribute.qmd
        text: Contribute
      - href: about.qmd
        text: About
    right:
      - href: es/index.qmd
        text: Español
  page-footer:
    center: "Metadata CC0 · Each dataset and paper keeps its own license and citation · Paper metadata from OpenAlex (CC0) and Crossref · Boundary © SIG-ACG, CC BY 4.0 · [GitHub](https://github.com/acg-atlas)"

format:
  html:
    theme: [cosmo, assets/custom.scss]
    include-after-body: assets/nav-es.html
    toc: false
    grid:
      body-width: 1100px
