project:
  type: website
  output-dir: _site
  resources:
    - data/*.json
    - data/*.geojson

website:
  title: "ACG Data Catalog"
  site-url: https://acg-atlas.pages.dev   # change to the final domain
  description: "Find publicly available research data from the Área de Conservación Guanacaste, Costa Rica."
  navbar:
    left:
      - href: explore.qmd
        text: Search
      - href: browse.qmd
        text: All data
      - href: map.qmd
        text: Map
      - href: submit.qmd
        text: Submit a DOI
      - href: about.qmd
        text: About
    right:
      - href: es/index.qmd
        text: Español
  page-footer:
    center: "Metadata CC0 · Each dataset keeps its own license and citation · Boundary © SIG-ACG, CC BY 4.0 · [GitHub](https://github.com/acg-atlas)"

format:
  html:
    theme: [cosmo, assets/custom.scss]
    toc: false
    grid:
      body-width: 1100px
