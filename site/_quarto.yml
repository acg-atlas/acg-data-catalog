project:
  type: website
  output-dir: _site
  post-render: _seo.R
  resources:
    - data/*.json
    - data/*.geojson
    - _headers
    - _redirects
    - assets/photos/*.jpg
    - assets/fonts/*
    - assets/vendor/leaflet/*
    - assets/vendor/leaflet/images/*

# Spanish is the default language. Spanish pages have Spanish file names
# (acerca-de.qmd), English pages keep the English ones (about.qmd, lang: en)
# and the English home is en/index.qmd. The navbar below is in Spanish;
# assets/nav-lang.html translates it on English pages.
lang: es

website:
  title: "ACG Atlas"
  site-url: https://acg-atlas.pages.dev   # change to the final domain
  description: "Datos y publicaciones de investigación del Área de Conservación Guanacaste, Costa Rica."
  image: assets/photos/og.jpg
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  navbar:
    left:
      - text: Datos
        menu:
          - href: buscar-datos.qmd
            text: Buscar datos
          - href: datos.qmd
            text: Todos los datos (tabla)
          - href: mapa.qmd
            text: Mapa
      - text: Publicaciones
        menu:
          - href: publicaciones.qmd
            text: Buscar publicaciones
          - href: publicaciones-tabla.qmd
            text: Todas las publicaciones (tabla)
      - href: hallazgos.qmd
        text: Hallazgos
      - href: contribuir.qmd
        text: Contribuir
      - href: acerca-de.qmd
        text: Acerca de
      - href: preguntas-frecuentes.qmd
        text: Preguntas
    right:
      - href: en/index.qmd
        text: English
  page-footer:
    center: "Metadatos CC0 · Cada conjunto de datos y publicación conserva su licencia y cita · Metadatos de publicaciones de OpenAlex (CC0) y Crossref · Límite © SIG-ACG, CC BY 4.0 · [Privacidad y condiciones](/privacidad.qmd) · [GitHub](https://github.com/acg-atlas)"

format:
  html:
    theme: [cosmo, assets/custom.scss]
    include-after-body: assets/nav-lang.html
    link-external-newwindow: true   # links to other sites open in a new tab
    toc: false
    grid:
      body-width: 1100px
