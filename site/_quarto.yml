project:
  type: website
  output-dir: _site
  post-render: _seo.R
  resources:
    - data/*.json
    - data/*.geojson
    - _headers
    - _redirects
    - assets/photos/*.jpg

# Spanish is the default language: Spanish pages live at the site root and
# English pages under en/ (en/_metadata.yml sets lang: en). The navbar below is
# in Spanish; assets/nav-lang.html translates it on English pages.
lang: es

website:
  title: "ACG Atlas"
  site-url: https://acg-atlas.pages.dev   # change to the final domain
  description: "Datos y publicaciones de investigación del Área de Conservación Guanacaste, Costa Rica."
  image: assets/photos/og.jpg
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  navbar:
    left:
      - text: Datos
        menu:
          - href: explore.qmd
            text: Buscar datos
          - href: browse.qmd
            text: Todos los datos (tabla)
          - href: map.qmd
            text: Mapa
      - text: Publicaciones
        menu:
          - href: papers.qmd
            text: Buscar publicaciones
          - href: papers-table.qmd
            text: Todas las publicaciones (tabla)
      - href: findings.qmd
        text: Hallazgos
      - href: contribute.qmd
        text: Contribuir
      - href: about.qmd
        text: Acerca de
      - href: faq.qmd
        text: Preguntas
    right:
      - href: en/index.qmd
        text: English
  page-footer:
    center: "Metadatos CC0 · Cada conjunto de datos y publicación conserva su licencia y cita · Metadatos de publicaciones de OpenAlex (CC0) y Crossref · Límite © SIG-ACG, CC BY 4.0 · [Privacidad y condiciones](privacy.qmd) · [GitHub](https://github.com/acg-atlas)"

format:
  html:
    theme: [cosmo, assets/custom.scss]
    include-after-body: assets/nav-lang.html
    link-external-newwindow: true   # links to other sites open in a new tab
    toc: false
    grid:
      body-width: 1100px
