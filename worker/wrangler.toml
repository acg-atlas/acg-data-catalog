name = "acg-catalog-submit"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Sites allowed to call the Worker (comma-separated): the domain, www, and pages.dev
ALLOWED_ORIGIN = "https://acg-atlas.org,https://www.acg-atlas.org,https://acg-atlas.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "acg-submissions"
database_id = "940fb77c-9061-48d0-a9cd-2e02868356d9"

# At most 3 submissions per minute per visitor (on top of Turnstile)
[[ratelimits]]
name = "SUBMIT_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 3
  period = 60

# DOI lookups as people paste: generous for a real list, not for a script
[[ratelimits]]
name = "RESOLVE_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 120
  period = 60

# Admin endpoints (used by the GitHub Actions): a few tries a minute
[[ratelimits]]
name = "ADMIN_LIMITER"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 10
  period = 60

# Secrets (never commit these). ADMIN_TOKEN: at least 32 random characters.
#   npx wrangler secret put ADMIN_TOKEN
#   npx wrangler secret put TURNSTILE_SECRET
