name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths: ["R/**", "tests/**", "worker/**"]

jobs:
  r:
    runs-on: ubuntu-latest
    env: { LANG: C.UTF-8 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2
        with: { use-public-rspm: true }
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2
        with:
          dependencies: '"all"'
          extra-packages: any::withr
      - run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with: { node-version: 22 }
      - run: npm test
        working-directory: worker
