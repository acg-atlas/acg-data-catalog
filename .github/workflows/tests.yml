name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths: ["R/**", "tests/**", "worker/**"]

jobs:
  r:
    runs-on: ubuntu-latest
    env: { LANG: C.UTF-8 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2
        with: { use-public-rspm: true }
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2
        with:
          dependencies: '"all"'
          extra-packages: any::withr
      - run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: { node-version: 22 }
      - run: npm test
        working-directory: worker
