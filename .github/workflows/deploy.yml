# On every merge to main: rebuild site data from the curated YAML, render the
# Quarto site, deploy to Cloudflare Pages, and sync submission statuses.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["catalog/**", "site/**", "R/**", "scripts/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      WORKER_URL: ${{ secrets.WORKER_URL }}
      WORKER_ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
      - run: Rscript scripts/build_site_data.R
      # Packages live in the project's renv library, which R only uses when it
      # starts in the repo root. Quarto runs site/_seo.R from site/, so point
      # every R session at that library.
      - name: Share the renv library with Quarto's R
        run: |
          Rscript -e 'writeLines(.libPaths()[1], "renv-lib.txt")'
          echo "R_LIBS=$(cat renv-lib.txt)" >> "$GITHUB_ENV"
          cat renv-lib.txt
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: quarto render site
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/_site --project-name=acg-atlas
      - name: Sync submission statuses to the Worker
        run: Rscript scripts/push_statuses.R
